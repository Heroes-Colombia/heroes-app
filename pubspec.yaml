name: heroes_app
description: Encuentra promociones cercas de ti.

version: 1.2.3+5

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_route: ^9.2.2
  ionicons: ^0.2.2
  dio: ^5.8.0+1
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  flutter_native_splash: ^2.4.6
  flutter_form_builder: ^10.0.1
  flutter_map: ^8.1.1
  equatable: ^2.0.7
  provider: ^6.1.4
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  bloc: ^9.0.0
  adaptive_theme: ^3.7.0
  image_picker: ^1.1.2
  firebase_storage: ^12.4.5
  intl: ^0.20.2
  form_builder_extra_fields: ^12.0.0
  flutter_slidable: ^4.0.0
  google_maps_flutter: ^2.12.1
  location: ^8.0.0
  url_launcher: ^6.3.1
  geocoding: ^3.0.0
  material_floating_search_bar_2: ^0.5.0
  geolocator: ^13.0.4
  dart_geohash: ^2.1.0
  flutter_dotenv: ^5.2.1
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.3.6
  flutter_local_notifications: ^19.0.0
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  http: ^1.3.0
  flutter_launcher_icons: ^0.14.3
  auto_route_generator: ^9.0.0
  geoflutterfire_plus: ^0.0.32
  file_picker: ^8.1.4
  uuid: ^4.5.1
  google_mlkit_text_recognition: ^0.15.0
  camera: ^0.10.5
  permission_handler: ^11.3.1
  share_plus: ^10.1.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
   - assets/images/
   - assets/icon/
   - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  android: true
  image: "assets/icon/icon.png"
  ios: true
  android_12:
    color: "#FFFFFF"
    image: "assets/icon/icon.png"
